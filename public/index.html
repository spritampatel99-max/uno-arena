<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>UNO ARENA — Play together. Outsmart everyone.</title>
  <meta name="description" content="UNO ARENA is a premium real-time multiplayer card game. Create a room, share the code, and outsmart your friends.">
  <meta name="theme-color" content="#090D19">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="UNO ARENA">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/cards.css">
  <link rel="stylesheet" href="/css/themes.css">
  <link rel="stylesheet" href="/css/metal.css">
  <link rel="stylesheet" href="/css/extras.css">
  <link rel="stylesheet" href="/css/screens.css">
  <link rel="stylesheet" href="/css/arena.css">
</head>
<body>
  <div id="app">
    <div class="atmos" aria-hidden="true"><i class="orb o1"></i><i class="orb o2"></i><i class="orb o3"></i></div>
    <main id="screen-root"></main>
    <div id="flight-layer" aria-hidden="true" style="position:absolute;inset:0;pointer-events:none;z-index:50"></div>
    <div id="overlay-root"></div>
    <div id="toast-root" aria-live="polite"></div>
    <canvas id="fx" aria-hidden="true"></canvas>
  </div>
  <noscript><p style="padding:24px;color:#fff;font-family:sans-serif">UNO ARENA needs JavaScript to run.</p></noscript>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
